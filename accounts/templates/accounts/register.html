{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request an account | {{ business.name }}</title>
  <link rel="icon" href="{% static 'images/logo/favicon.png' %}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark"><i class="fa-solid fa-boxes-stacked"></i></span><span>{{ business.name }}</span></div>
    <div class="card">
      <div class="card-body p-4">
{% load crispy_forms_tags %}
        <h1 class="h5 mb-1">Request an account</h1>
        <p class="text-muted small mb-4">An administrator approves new accounts before they can sign in.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100">Request account</button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">Already approved? <a href="{% url 'user-login' %}">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
