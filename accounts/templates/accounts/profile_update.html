{% extends "store/base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'user-profile' %}"><i class="fa-solid fa-arrow-left"></i> Profile</a>
<div class="page-header"><div><h1>Edit profile</h1></div></div>
<div class="card form-narrow"><div class="card-body">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ u_form|crispy }}
    {{ p_form|crispy }}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-light" href="{% url 'user-profile' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock content %}
